<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3a99">
<title>Görevhane</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 fill=%27%231d3a99%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%277.5%27 stroke=%27white%27 stroke-width=%272%27 fill=%27none%27/%3E%3Cpath d=%27M8.5 12.3l2.4 2.4 4.6-5%27 stroke=%27white%27 stroke-width=%272.2%27 fill=%27none%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&family=Caveat:wght@600&display=swap">
<style>
/* Görevhane — Evrak Defteri: form kağıdı zemin, kaşe mavisi şerit, tarihli kaşe ve imza. Yalnızca açık tema. */
:root {
  --ground: #e9efec; --sheet: #ffffff; --row: #f4f7f5;
  --ink: #1b2733; --muted: #55626d; --grid: #c5d1cb; --grid-2: #dde5e1;
  --shell: #1d3a99; --shell-hover: #2a4bb8; --shell-ink: #ffffff; --shell-muted: #cbd6ff;
  --stamp: #2346b5; --stamp-soft: #e6ecfb;
  --red: #c42f2b; --red-soft: #fbe9e7;
  --amber: #9a5200; --amber-soft: #fdf0dc;
  --ui: 'Libre Franklin', 'Segoe UI', system-ui, sans-serif;
  --num: 'Courier Prime', 'Courier New', ui-monospace, monospace;
  --sign: 'Caveat', 'Segoe Script', cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 14.5px; line-height: 1.5; caret-color: var(--stamp); }
::selection { background: var(--stamp-soft); color: var(--ink); }
* { scrollbar-color: var(--grid) transparent; scrollbar-width: thin; }
a { color: var(--stamp); text-underline-offset: 3px; }
h1, h2 { font-family: var(--ui); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 17px; font-weight: 800; letter-spacing: -.005em; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* Düğmeler: keskin köşe, kaşe mavisi */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; font-weight: 700; font-size: 14px; border: 1px solid var(--stamp); background: var(--stamp); color: #fff; white-space: nowrap; transition: background-color .15s; }
.btn:hover:not(:disabled) { background: #1b3a99; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: var(--sheet); color: var(--ink); border-color: var(--grid); }
.btn.ghost:hover:not(:disabled) { background: var(--row); border-color: var(--muted); }
.btn.cta, .btn.ok { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.btn.danger { background: var(--sheet); color: var(--red); border-color: var(--red); }
.btn.danger:hover:not(:disabled) { background: var(--red-soft); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.block { width: 100%; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--stamp); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:disabled { color: var(--muted); cursor: default; text-decoration: none; }

/* Form alanları */
.field { display: grid; gap: 5px; margin-bottom: 14px; }
.field > label { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.input, .textarea, .select { width: 100%; background: var(--sheet); border: 1px solid var(--grid); border-radius: 0; padding: 10px 12px; font-size: 14.5px; }
.input:hover, .textarea:hover, .select:hover { border-color: var(--muted); }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--stamp); box-shadow: 0 0 0 3px var(--stamp-soft); }
.input.err { border-color: var(--red); }
.input::placeholder, .textarea::placeholder { color: #6b7782; }
.textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint.err { color: var(--red); } .hint.ok, .hint .ok { color: var(--stamp); }
.alert { padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; border: 1px solid; }
.alert.err { background: var(--red-soft); color: var(--red); border-color: #efc2bd; }
.alert.ok { background: var(--stamp-soft); color: var(--stamp); border-color: #c4d0f3; }
.alert.warn { background: var(--amber-soft); color: var(--amber); border-color: #f0d3a8; }
.meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 2px; }
.meter i { height: 4px; background: var(--grid-2); }
.meter i.on { background: var(--stamp); }
.checks { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12.5px; display: grid; gap: 2px; }
.checks li { color: var(--muted); } .checks li.ok { color: var(--stamp); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

/* Logo: kaşe halkası içinde onay işareti */
.logo { font-weight: 800; font-size: 20px; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
.logo .mk { width: 28px; height: 28px; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; transform: rotate(-8deg); flex: none; }

/* Giriş ekranları: kaşe mavisi başlık şeridi olan form tabakası */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 440px; background: var(--sheet); border: 1px solid var(--grid); padding: 0 28px 26px; box-shadow: 0 18px 40px -30px rgba(27, 39, 51, .5); }
.auth-card > .logo:first-child { display: flex; margin: 0 -28px 22px; padding: 16px 28px; background: var(--shell); color: var(--shell-ink); }
.auth-card h1 { margin: 0 0 4px; font-size: 26px; }
.auth-card .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.auth-foot { margin-top: 18px; font-size: 13.5px; color: var(--muted); text-align: center; }
.steps { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 18px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--grid); }
.steps span { padding: 7px 10px; color: var(--muted); text-align: center; }
.steps span + span { border-left: 1px solid var(--grid); }
.steps span.on { background: var(--stamp-soft); color: var(--stamp); }
.steps span.past { color: var(--stamp); }
.code { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0 6px; }
.code input { width: 100%; min-width: 0; padding: 0; aspect-ratio: 1 / 1.15; text-align: center; font-family: var(--num); font-size: 24px; font-weight: 700; border: 1px solid var(--grid); border-radius: 0; background: var(--sheet); }
.code input:focus { outline: none; border-color: var(--stamp); box-shadow: 0 0 0 3px var(--stamp-soft); }
.code-meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }

/* Uygulama kabuğu: solda kaşe mavisi şerit */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--shell); color: var(--shell-ink); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 26px; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { padding: 9px 12px; font-weight: 600; font-size: 14.5px; color: var(--shell-muted); text-decoration: none; }
.side nav a:hover { background: var(--shell-hover); color: #fff; }
.side nav a.active { background: var(--sheet); color: var(--shell); }
.side .foot { margin-top: auto; display: grid; gap: 10px; }
.sidebtn { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 1px solid rgba(255, 255, 255, .28); color: #fff; padding: 9px 12px; font-weight: 600; text-align: left; position: relative; }
.sidebtn:hover { background: var(--shell-hover); }
.badge { margin-left: auto; background: #fff; color: var(--shell); font-family: var(--num); font-size: 12px; font-weight: 700; padding: 0 6px; line-height: 18px; min-width: 18px; text-align: center; }
.me { border-top: 1px solid rgba(255, 255, 255, .25); padding-top: 12px; font-size: 13px; color: var(--shell-muted); overflow-wrap: anywhere; }
.me b { display: block; color: #fff; font-size: 14px; }
.me .role { display: inline-block; margin-top: 4px; border: 1px solid var(--shell-muted); padding: 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.me .linkbtn { color: #fff; margin-top: 8px; display: block; }
.menu-wrap { position: relative; }
.menu { position: absolute; left: calc(100% + 10px); bottom: 0; background: var(--sheet); color: var(--ink); border: 1px solid var(--grid); box-shadow: 0 18px 40px -20px rgba(27, 39, 51, .45); z-index: 30; }
.notif-panel { width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; }
.menu .mh { padding: 11px 14px; border-bottom: 1px solid var(--grid-2); font-size: 13px; color: var(--muted); }
.notif { display: grid; grid-template-columns: 8px 1fr; gap: 10px; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--grid-2); background: none; width: 100%; text-align: left; color: var(--ink); }
.notif:hover { background: var(--row); }
.notif .dot { width: 8px; height: 8px; margin-top: 6px; }
.notif.unread .dot { background: var(--stamp); }
.notif .ex { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notif .when { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-family: var(--num); }

/* Sayfa */
.page { padding: 28px 36px 60px; min-width: 0; max-width: 1240px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--sheet); border: 1px solid var(--grid); padding: 0 12px; color: var(--muted); width: 320px; max-width: 100%; }
.search:focus-within { border-color: var(--stamp); box-shadow: 0 0 0 3px var(--stamp-soft); }
.search input { border: 0; outline: 0; background: none; padding: 10px 0; width: 100%; color: var(--ink); }
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--grid); margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 0 0 10px; font-weight: 600; font-size: 14.5px; color: var(--muted); }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.tabs button .n { font-size: 13.5px; }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; }

/* Kayıt tablosu: form ızgarası */
.sheet { background: var(--sheet); border: 1px solid var(--grid); }
.rec { display: grid; grid-template-columns: 112px 88px minmax(0, 1fr) 150px 120px 158px; border-top: 1px solid var(--grid-2); min-height: 72px; align-items: stretch; cursor: pointer; }
.rec:hover { background: var(--row); }
.rec > div { padding: 10px 14px; border-left: 1px solid var(--grid-2); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.rec > div:first-child { border-left: 0; }
.rec.h { min-height: 38px; border-top: 0; background: var(--row); cursor: default; }
.rec.h > div { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 0; padding-bottom: 0; }
.no { font-family: var(--num); font-weight: 700; font-size: 14px; }
.dt { font-family: var(--num); font-size: 13.5px; color: var(--muted); }
.tt { font-weight: 600; font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.tm { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.who { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.who b { color: var(--ink); font-weight: 600; }
.due { font-family: var(--num); font-size: 13.5px; }
.due.late { color: var(--red); font-weight: 700; }
.st { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.stampbtn { margin: 8px 4px 4px; align-self: flex-start; display: inline-flex; align-items: center; min-height: 38px; padding: 7px 10px; background: var(--sheet); color: var(--stamp); border: 2px solid var(--stamp); outline: 1px solid var(--stamp); outline-offset: 2px; border-radius: 5px; transform: rotate(-3deg); font-weight: 800; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; transition: background-color .15s, transform .15s; }
.stampbtn:hover { background: var(--stamp-soft); transform: rotate(-3deg) scale(1.04); }
.stampbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.recent { margin-top: 26px; }
.recent h2 { margin-bottom: 12px; }
.recent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.rc { background: var(--sheet); border: 1px solid var(--grid); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto 1fr; gap: 4px 14px; align-items: start; color: var(--ink); text-decoration: none; }
.rc:hover { border-color: var(--muted); }
.rc .no { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.rc .tt { grid-column: 1 / -1; }
.rc p { grid-column: 1 / -1; margin: 2px 0 6px; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rc .sign { font-size: 26px; }
.rc > .sig, .rc > .stamp { grid-row: 4; align-self: end; }
.rc .dt { font-size: 12.5px; }
.rec.done .tt { color: var(--muted); }
.more { border-top: 1px solid var(--grid-2); padding: 10px; text-align: center; }

/* Kaşeler */
.stamp { display: inline-flex; flex-direction: column; align-items: center; width: max-content; border: 2px solid var(--stamp); outline: 1px solid var(--stamp); outline-offset: 2px; border-radius: 6px; color: var(--stamp); padding: 3px 9px; transform: rotate(-7deg); font-weight: 800; font-size: 12px; letter-spacing: .1em; line-height: 1.25; }
.stamp small { font-family: var(--num); font-size: 11.5px; letter-spacing: .02em; font-weight: 700; }
.stamp.lg { font-size: 15px; padding: 5px 12px; }
.stamp.lg small { font-size: 13px; }
.stamp.press { animation: press .42s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes press { from { transform: scale(1.7) rotate(-15deg); opacity: 0; filter: blur(2px); } 70% { opacity: 1; filter: blur(0); } to { transform: scale(1) rotate(-7deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp.press { animation: none; } }
.acil { display: inline-block; width: max-content; border: 2px solid var(--red); color: var(--red); font-weight: 800; font-size: 11px; letter-spacing: .14em; padding: 0 6px; transform: rotate(-3deg); margin-bottom: 5px; }
.pri { font-weight: 700; }
.pri.YUKSEK { color: var(--amber); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border: 1px solid var(--grid); background: var(--sheet); color: var(--ink); }
.tag i { width: 8px; height: 8px; display: block; border-radius: 50%; }
.late-txt { color: var(--red); font-weight: 700; }
.sign { font-family: var(--sign); font-size: 30px; font-weight: 600; color: var(--stamp); line-height: 1; }

/* Kayıt detayı */
.detail { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.card { background: var(--sheet); border: 1px solid var(--grid); padding: 22px; }
.card h2 { margin-bottom: 14px; }
.rec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; margin: 12px 0 18px; font-size: 15px; }
.kv { display: grid; grid-template-columns: 130px 1fr; margin: 0; border-top: 1px solid var(--grid-2); }
.kv dt, .kv dd { padding: 8px 0; border-bottom: 1px solid var(--grid-2); font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding-top: 10px; }
.kv dd { font-weight: 500; overflow-wrap: anywhere; }
.closing { margin-top: 18px; border: 1px dashed var(--grid); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: end; }
.closing .lbl { grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.closing p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { padding: 10px 0; border-bottom: 1px solid var(--grid-2); font-size: 13.5px; }
.tl li:first-child { padding-top: 0; }
.tl .when { font-family: var(--num); font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 2px; }
.tl .who { color: var(--ink); font-weight: 700; font-size: 13.5px; }
.quote { display: block; background: var(--row); border: 1px solid var(--grid-2); padding: 8px 10px; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.quote.ok { background: var(--stamp-soft); border-color: #c4d0f3; }
.quote.bad { background: var(--red-soft); border-color: #efc2bd; }
.mention { color: var(--stamp); font-weight: 700; }
.composer { position: relative; margin-top: 16px; }
.suggest { position: absolute; left: 0; bottom: calc(100% + 4px); background: var(--sheet); border: 1px solid var(--grid); box-shadow: 0 12px 28px -16px rgba(27, 39, 51, .4); min-width: 200px; z-index: 5; }
.suggest button { display: block; width: 100%; padding: 8px 12px; background: none; border: 0; text-align: left; color: var(--ink); font-weight: 600; }
.suggest button.on, .suggest button:hover { background: var(--stamp-soft); }
.av { display: none; }

/* Pencereler */
.backdrop { position: fixed; inset: 0; background: rgba(27, 39, 51, .45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--sheet); border-top: 6px solid var(--shell); padding: 22px; width: 100%; max-width: 500px; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .45); }
.modal h2 { margin-bottom: 6px; font-size: 20px; }
.modal .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.counter { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 5px; }
.tagpick { display: flex; flex-wrap: wrap; gap: 6px; }
.tagpick button { border: 1px solid var(--grid); background: var(--sheet); padding: 4px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); }
.tagpick button.on { background: var(--stamp-soft); border-color: var(--stamp); color: var(--stamp); font-weight: 700; }
.tagpick i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Rapor: form alanı kutuları olarak döküm */
.ledger { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--sheet); border: 1px solid var(--grid); margin-bottom: 18px; }
.ledger > div { padding: 14px 18px; border-left: 1px solid var(--grid-2); }
.ledger > div:first-child { border-left: 0; }
.ledger .k { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ledger .v { font-family: var(--num); font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 6px; }
.ledger .v.bad { color: var(--red); }
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.chartbox { width: 100%; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }

/* Admin tabloları */
.tbl-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--grid); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--grid-2); vertical-align: middle; }
.tbl th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--row); }
.tbl tr:last-child td { border-bottom: 0; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .1em; padding: 1px 7px; border: 1px solid; display: inline-block; text-transform: uppercase; }
.pill.s-OPEN { color: var(--stamp); }
.pill.s-DONE { color: var(--muted); }
.pill.p-ACIL { color: var(--red); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; font-size: 14px; z-index: 60; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .5); max-width: calc(100vw - 32px); }
.toast.err { background: var(--red); }
.center { display: grid; place-items: center; min-height: 50vh; color: var(--muted); }

@media (max-width: 900px) {

function h(tag, props, ...kids) {

    else if (k === 'ref') v(el);

  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));

function errText(e) {
  const m = (e && (e.message || e.error_description)) || String(e || '');
  if (/Invalid login credentials/i.test(m)) return 'E-posta veya şifre hatalı.';

  const wait = m.match(/after (\d+) seconds?/i);

  if (/rate limit/i.test(m)) return 'Çok fazla deneme yapıldı. Biraz sonra tekrar dene.';

// 6 kutulu kod girişi (yapıştırma, geri silme, hızlı yazım desteklenir)
function codeInput(onChange) {
  let code = '';
  const boxes = [];
  const set = (next) => {
    code = next.replace(/\D/g, '').slice(0, 6);
    boxes.forEach((b, i) => (b.value = code[i] || ''));
    boxes[Math.min(code.length, 5)].focus();
    onChange(code);
  };
  for (let i = 0; i < 6; i++) {
    boxes.push(h('input', {
      inputmode: 'numeric', autocomplete: i === 0 ? 'one-time-code' : 'off', 'aria-label': `Kodun ${i + 1}. hanesi`,
      onfocus: (e) => { if (i > code.length) boxes[code.length].focus(); else e.target.select(); },
      oninput: (e) => {
        const typed = e.target.value.replace(/\D/g, '');
        if (!typed) return set(code.slice(0, i));
        const digit = typed.length > 1 && code[i] ? typed.replace(code[i], '') || typed : typed;
        set(code.slice(0, i) + digit);
      },
      onkeydown: (e) => { if (e.key === 'Backspace' && !code[i] && i > 0) { e.preventDefault(); set(code.slice(0, i - 1)); } },
      onpaste: (e) => { e.preventDefault(); set(code.slice(0, i) + e.clipboardData.getData('text')); },
    }));
  }
  return { el: h('div', { class: 'code' }, boxes), clear: () => set(''), focus: () => boxes[0].focus() };
}

// Geri sayım: her yarım saniyede cb(kalan) çağrılır; bağlı olduğu öğe sayfadan kalkınca durur.
function countdown(seconds, cb, el) {
  const end = Date.now() + seconds * 1000;
  const tick = () => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); cb(left); return left; };
  tick();
  let seen = false;
  const t = setInterval(() => {
    if (el.isConnected) seen = true;
    else if (seen) return clearInterval(t);
    if (tick() === 0) clearInterval(t);
  }, 500);
  return () => clearInterval(t);
}

}

  setTimeout(() => onSession(event, session), 0);

async function onSession(event, session) {
  const prevUser = state.me && state.me.id;
  const newUser = session && session.user.id;
  state.session = session;
  if (!session) {
    state.me = null;
    stopRealtime();
  } else if (prevUser !== newUser) {
    const { data } = await sb.from('profiles').select('id,username,role,status').eq('id', newUser).maybeSingle();
    if (!data || data.status !== 'ACTIVE') {
      toast('Hesabına erişilemiyor: hesabın pasifleştirilmiş olabilir.', 'err');
      await sb.auth.signOut();
      return;
    }
    state.me = data;
    state.me.email = session.user.email;
    startRealtime();
    loadNotifications();
  }
  const wasReady = state.ready;
  state.ready = true;
  if (state.hold) return; // şifre sıfırlama gibi akışlar bitene kadar ekran değişmez
  // Saatlik oturum yenilemede ekran yeniden çizilmez (yazılanlar kaybolmasın)
  if (!wasReady || prevUser !== (state.me && state.me.id)) render();
}

function startRealtime() {
  stopRealtime();
  const uid = state.me.id;
  const refreshTasks = debounce(() => listeners.tasks.forEach((f) => f()), 400);
  channel = sb.channel('gorevhane-' + uid)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${uid}` }, async (p) => {
      const { data } = await sb.from('notifications').select(NOTIF_SELECT).eq('id', p.new.id).maybeSingle();

      state.notifs = [data, ...state.notifs].slice(0, 30);
      state.unread += 1;

      if (p.new.status === 'DISABLED') {
        await sb.auth.signOut();

function notificationText(n) {
  const who = n.actor ? `@${n.actor.username}` : 'Biri';

  return {
    mention: `${who} ${t} görevinde senden bahsetti`,

    comment: `${who} ${t} görevine yorum yazdı`,
    due_24h: `${t} görevinin son tarihine 1 gün kaldı`,
    due_1h: `${t} görevinin son tarihine 1 saat kaldı`,
  }[n.type] || 'Yeni bildirim';
}

async function loadNotifications() {
  const [{ data }, { count }] = await Promise.all([
    sb.from('notifications').select(NOTIF_SELECT).order('created_at', { ascending: false }).limit(30),
    sb.from('notifications').select('id', { count: 'exact', head: true }).eq('is_read', false),
  ]);
  state.notifs = data || [];
  state.unread = count || 0;
  updateBell();
}
function updateBell() {
  const btn = document.getElementById('bell');
  if (!btn) return;
  btn.setAttribute('aria-label', `Bildirimler, ${state.unread} okunmamış`);
  const old = btn.querySelector('.badge');
  if (old) old.remove();
  if (state.unread > 0) btn.append(h('span', { class: 'badge' }, state.unread > 99 ? '99+' : state.unread));
}

function dropdown(button, buildMenu) {
  const wrap = h('div', { class: 'menu-wrap' }, button);
  let menu = null;
  const close = () => { if (menu) { menu.remove(); menu = null; document.removeEventListener('mousedown', outside); } };
  const outside = (e) => { if (!wrap.contains(e.target)) close(); };
  button.addEventListener('click', () => {
    if (menu) return close();
    menu = buildMenu(close);
    wrap.append(menu);
    document.addEventListener('mousedown', outside);
  });
  return wrap;
}

/* =========================================================
   Kayıt: 1) bilgiler 2) e-posta kodu
   ========================================================= */
function registerPage() {
  const pending = sessionStorage.getItem('verifyEmail');
  sessionStorage.removeItem('verifyEmail');
  const f = { username: '', email: pending || '', password: '', password2: '' };
  const card = h('div', { class: 'auth-card' });
  const wrap = h('div', { class: 'auth-wrap' }, card);

  function stepInfo() {
    const alert = h('div', { class: 'alert err', hidden: true });
    const errs = {};
    const hintOf = (k, def) => (errs[k] = h('div', { class: 'hint' }, def || ''));
    const pw = passwordRules(() => f.password);
    const btn = h('button', { class: 'btn block', disabled: true }, 'Kayıt ol');
    const validate = () => {
      const u = f.username.trim().toLowerCase();
      const userOk = USERNAME_RE.test(u);
      errs.username.className = 'hint' + (f.username && !userOk ? ' err' : f.username ? ' ok' : '');
      errs.username.textContent = !f.username ? 'Küçük harf, rakam ve _ (3–20 karakter)' : userOk ? `Görünecek ad: @${u}` : 'Sadece küçük harf, rakam ve _ kullan (3–20 karakter)';
      const emailOk = EMAIL_RE.test(f.email.trim());
      errs.email.className = 'hint err';
      errs.email.textContent = f.email && !emailOk ? 'Geçerli bir e-posta adresi yaz' : '';
      const pwOk = PASSWORD_RULES.every((r) => r.test(f.password));
      const same = f.password === f.password2;
      errs.password2.className = 'hint err';
      errs.password2.textContent = f.password2 && !same ? 'Şifreler aynı değil' : '';
      pw.update();
      btn.disabled = !(userOk && emailOk && pwOk && same && f.password2);
    };
    const inp = (k, attrs) => h('input', Object.assign({ id: 'reg-' + k, class: 'input', value: f[k], oninput: (e) => { f[k] = e.target.value; validate(); } }, attrs));
    card.replaceChildren(
      logo(), h('h1', null, 'Kayıt ol'), h('p', { class: 'sub' }, 'Hesabını oluştur, e-postana gelecek kodla onayla.'),
      h('div', { class: 'steps' }, h('span', { class: 'on' }, '1 · Bilgiler'), h('span', null, '2 · E-posta onayı')),
      alert,
      h('form', {
        novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          alert.hidden = true;
          btn.disabled = true;
          btn.textContent = 'Kod gönderiliyor…';
          const username = f.username.trim().toLowerCase();
          const email = f.email.trim().toLowerCase();
          try {
            if (!(await rpc('username_available', { p_username: username }))) throw new Error('Bu kullanıcı adı alınmış.');
            const { data, error } = await sb.auth.signUp({ email, password: f.password, options: { data: { username } } });
            if (error) throw error;
            if (data.user && data.user.identities && data.user.identities.length === 0) throw new Error('Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.');
            if (data.session) return; // onay kapalıysa doğrudan giriş yapılır
            f.email = email;
            stepCode(false);
          } catch (err) {
            alert.textContent = errText(err);
            alert.hidden = false;
            btn.textContent = 'Kayıt ol';
            validate();
          }
        },
      },
      field('Kullanıcı adı', inp('username', { autocomplete: 'username' }), hintOf('username', 'Küçük harf, rakam ve _ (3–20 karakter)')),
      field('E-posta', inp('email', { type: 'email', autocomplete: 'email' }), hintOf('email')),
      field('Şifre', inp('password', { type: 'password', autocomplete: 'new-password' }), pw.el),
      field('Şifre tekrar', inp('password2', { type: 'password', autocomplete: 'new-password' }), hintOf('password2')),
      btn),
      h('div', { class: 'auth-foot' }, 'Zaten hesabın var mı? ', h('a', { href: '#/giris' }, 'Giriş yap')));
    validate();
    setTimeout(() => card.querySelector('#reg-username').focus(), 0);
  }

  function stepCode(canResendNow) {
    let code = '';
    const alert = h('div', { class: 'alert err', hidden: true });
    const expires = h('span');
    const btn = h('button', { class: 'btn', disabled: true }, 'Kaydı tamamla');
    const resendBtn = h('button', { type: 'button', class: 'btn ghost' }, 'Kodu yeniden gönder');
    const ci = codeInput((v) => { code = v; btn.disabled = v.length !== 6; });
    let stopExp = () => {}, stopRes = () => {};
    const startTimers = (resendWait) => {
      stopExp(); stopRes();
      stopExp = countdown(CODE_TTL, (left) => {
        expires.replaceChildren(left > 0 ? h('span', null, 'Kodun süresi: ', h('b', null, mmss(left))) : h('span', { class: 'late-txt' }, 'Kodun süresi doldu, yeni kod iste'));
      }, expires);
      stopRes = countdown(resendWait, (left) => {
        resendBtn.disabled = left > 0;
        resendBtn.textContent = 'Kodu yeniden gönder' + (left > 0 ? ` (${mmss(left)})` : '');
      }, resendBtn);
    };
    resendBtn.addEventListener('click', async () => {
      alert.hidden = true;
      const { error } = await sb.auth.resend({ type: 'signup', email: f.email });
      if (error) { alert.textContent = errText(error); alert.hidden = false; return; }
      toast('Yeni kod gönderildi.');
      ci.clear();
      startTimers(RESEND_WAIT);
    });
    card.replaceChildren(
      logo(), h('h1', null, 'E-postanı kontrol et'),
      h('p', { class: 'sub' }, h('b', null, f.email), ' adresine 6 haneli bir kod gönderdik. Gelmediyse spam klasörüne bak.'),
      h('div', { class: 'steps' }, h('span', { class: 'past' }, ICON_OK(), 'Bilgiler'), h('span', { class: 'on' }, '2 · E-posta onayı')),
      alert,
      h('form', {
        novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          if (code.length !== 6) return;
          btn.disabled = true;
          btn.textContent = 'Kontrol ediliyor…';
          alert.hidden = true;
          const { error } = await sb.auth.verifyOtp({ email: f.email, token: code, type: 'email' });
          if (error) {
            alert.textContent = errText(error);
            alert.hidden = false;
            btn.textContent = 'Kaydı tamamla';
            ci.clear();
            return;
          }
          toast('Kayıt tamamlandı. Hoş geldin!');
          go('/');
        },
      }, ci.el, h('div', { class: 'code-meta' }, expires, h('span', null, '')),
      h('div', { class: 'row-actions', style: { marginTop: '16px' } }, btn, resendBtn)),
      h('p', { class: 'hint', style: { marginTop: '14px' } }, 'E-posta adresini yanlış mı yazdın? ',
        h('button', { type: 'button', class: 'linkbtn', onclick: () => { stopExp(); stopRes(); stepInfo(); } }, 'Geri dön ve düzelt')));
    startTimers(canResendNow ? 0 : RESEND_WAIT);
    setTimeout(ci.focus, 0);
  }

  pending ? stepCode(false) : stepInfo();
  return wrap;
}

    card.replaceChildren(logo(), h('h1', null, 'Şifreni sıfırla'), h('p', { class: 'sub' }, 'Hesabının e-posta adresini yaz, sana bir kod gönderelim.'), alert,
      h('form', {
        novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          btn.disabled = true;
          const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase());
          if (error) { alert.textContent = errText(error); alert.hidden = false; btn.disabled = false; return; }
          email = email.trim().toLowerCase();
          step2();
        },
      }, field('E-posta', h('input', { id: 'forgot-email', class: 'input', type: 'email', value: email, oninput: (e) => { email = e.target.value; btn.disabled = !EMAIL_RE.test(email.trim()); } })), btn),
      h('div', { class: 'auth-foot' }, h('a', { href: '#/giris' }, 'Girişe dön')));
    setTimeout(() => card.querySelector('#forgot-email').focus(), 0);
  }
  function step2() {
    let code = '', p1 = '', p2 = '';
    const alert = h('div', { class: 'alert err', hidden: true });
    const pw = passwordRules(() => p1);
    const mismatch = h('div', { class: 'hint err' });
    const btn = h('button', { class: 'btn', disabled: true }, 'Şifreyi değiştir');
    const sync = () => {
      pw.update();
      mismatch.textContent = p2 && p1 !== p2 ? 'Şifreler aynı değil' : '';
      btn.disabled = !(code.length === 6 && PASSWORD_RULES.every((r) => r.test(p1)) && p1 === p2);
    };
    const ci = codeInput((v) => { code = v; sync(); });
    card.replaceChildren(logo(), h('h1', null, 'Şifreni sıfırla'),
      h('p', { class: 'sub' }, 'Bu e-posta ile bir hesap varsa ', h('b', null, email), ' adresine 6 haneli bir kod gönderdik.'), alert,

          e.preventDefault();
          btn.disabled = true;
          alert.hidden = true;
          state.hold = true; // kod doğrulanınca oturum açılır; yeni şifre kaydedilene kadar ekran değişmesin
          const v = await sb.auth.verifyOtp({ email, token: code, type: 'recovery' });
          if (v.error) { state.hold = false; alert.textContent = errText(v.error); alert.hidden = false; ci.clear(); return; }
          const u = await sb.auth.updateUser({ password: p1 });
          state.hold = false;
          if (u.error) { await sb.auth.signOut(); alert.textContent = errText(u.error); alert.hidden = false; sync(); return; }
          toast('Şifren değişti.');
          location.hash = '#/';
          render();
        },
      },
      field('E-postana gelen kod', ci.el),
      field('Yeni şifre', h('input', { id: 'reset-p1', class: 'input', type: 'password', autocomplete: 'new-password', oninput: (e) => { p1 = e.target.value; sync(); } }), pw.el),
      field('Yeni şifre tekrar', h('input', { id: 'reset-p2', class: 'input', type: 'password', autocomplete: 'new-password', oninput: (e) => { p2 = e.target.value; sync(); } }), mismatch),
      h('div', { class: 'row-actions' }, btn, h('button', { type: 'button', class: 'btn ghost', onclick: step1 }, 'Yeni kod iste'))),
      h('div', { class: 'auth-foot' }, h('a', { href: '#/giris' }, 'Girişe dön')));
    pw.update();
    setTimeout(ci.focus, 0);
  }
  step1();
  return h('div', { class: 'auth-wrap' }, card);
}

   Görev formu, tamamlama penceresi

let tagCache = null;
async function loadTags(force) {
  if (force || !tagCache) {
    const { data } = await sb.from('tags').select('id,name,color').order('name');
    tagCache = data || [];
  }
  return tagCache;
}

function taskForm(v) {
  const err = { title: h('div', { class: 'hint err' }), due: h('div', { class: 'hint err' }) };
  const tagBox = h('div', { class: 'tagpick' }, h('span', { class: 'hint' }, 'Etiketler yükleniyor…'));
  loadTags().then((tags) => {
    if (!tags.length) return tagBox.replaceChildren(h('span', { class: 'hint' }, 'Henüz etiket yok. Etiketleri admin ekler.'));
    tagBox.replaceChildren(...tags.map((t) => {
      const b = h('button', { type: 'button', 'aria-pressed': String(v.tagIds.includes(t.id)), class: v.tagIds.includes(t.id) ? 'on' : '' }, h('i', { style: { background: t.color } }), t.name);
      b.addEventListener('click', () => {
        if (v.tagIds.includes(t.id)) v.tagIds = v.tagIds.filter((x) => x !== t.id);
        else if (v.tagIds.length < MAX_TAGS) v.tagIds = [...v.tagIds, t.id];
        else return toast(`En fazla ${MAX_TAGS} etiket seçilebilir.`, 'err');
        b.classList.toggle('on', v.tagIds.includes(t.id));
        b.setAttribute('aria-pressed', String(v.tagIds.includes(t.id)));
      });
      return b;
    }));
  });
  const el = h('div', null,
    field('Başlık', h('input', { id: 'task-title', class: 'input', maxlength: '120', value: v.title, oninput: (e) => (v.title = e.target.value) }), err.title),
    field('Açıklama (isteğe bağlı)', h('textarea', { id: 'task-desc', class: 'textarea', maxlength: '5000', oninput: (e) => (v.description = e.target.value) }, v.description)),
    h('div', { class: 'grid2' },
      field('Öncelik', h('select', { id: 'task-priority', class: 'select', onchange: (e) => (v.priority = e.target.value) },
        PRIORITIES.map((p) => h('option', { value: p, selected: p === v.priority }, PRIORITY_LABELS[p])))),
      field('Son tarih (isteğe bağlı)', h('input', { id: 'task-due', class: 'input', type: 'datetime-local', value: toLocalInput(v.dueAt), min: toLocalInput(new Date().toISOString()), onchange: (e) => (v.dueAt = fromLocalInput(e.target.value)) }), err.due)),
    field(`Etiketler (en fazla ${MAX_TAGS})`, tagBox));
  const validate = () => {
    err.title.textContent = v.title.trim().length < 3 ? 'Başlık en az 3 karakter olmalı' : '';
    err.due.textContent = v.dueAt && new Date(v.dueAt) < new Date(Date.now() - 60000) ? 'Son tarih geçmişte olamaz' : '';
    return !err.title.textContent && !err.due.textContent;
  };
  setTimeout(() => el.querySelector('#task-title').focus(), 0);
  return { el, validate };
}

  setTimeout(() => ta.focus(), 0);

/* =========================================================
   Görev listesi
   ========================================================= */
const TASK_LIST_SELECT = 'id,title,priority,due_at,status,created_at,updated_at,completed_at,completion_note,' +
  'created_by:profiles!tasks_created_by_fkey(id,username),updated_by:profiles!tasks_updated_by_fkey(id,username),' +
  'completed_by:profiles!tasks_completed_by_fkey(id,username),task_tags(tags(id,name,color)),comments(count)';
const escLike = (s) => s.replace(/[\\%_]/g, (c) => '\\' + c);

function taskRow(t, onComplete) {
  const done = t.status === 'DONE';
  const late = !done && isOverdue(t.due_at);
  const tags = (t.task_tags || []).map((x) => x.tags).filter(Boolean);
  const comments = (t.comments && t.comments[0] && t.comments[0].count) || 0;
  const edited = t.updated_by && t.updated_by.id !== t.created_by.id && t.updated_at !== t.created_at;
  const sub = [t.priority === 'ACIL' ? null : PRIORITY_LABELS[t.priority] + ' öncelik', ...tags.map((g) => g.name), comments ? `${comments} yorum` : null].filter(Boolean).join(' · ');
  const open = () => go('/gorev/' + t.id);

function composer(taskId, onPosted) {
  let sugs = [], sel = 0;
  const box = h('div', { class: 'suggest', role: 'listbox', hidden: true });
  const err = h('div', { class: 'hint err' });
  const send = h('button', { class: 'btn sm', disabled: true }, 'Yorum yaz');
  const ta = h('textarea', { id: 'comment-body', class: 'textarea', style: { minHeight: '70px' }, maxlength: '2000', placeholder: 'Yorum yaz… Birinden bahsetmek için @ yaz.' });
  const mentionAt = () => {
    const upto = ta.value.slice(0, ta.selectionStart);
    const m = upto.match(/(^|\s)@([a-z0-9_]{0,20})$/i);
    return m ? { start: upto.length - m[2].length - 1, q: m[2].toLowerCase() } : null;
  };
  const drawSugs = () => {
    box.hidden = !sugs.length;
    box.replaceChildren(...sugs.map((u, i) => h('button', { type: 'button', class: i === sel ? 'on' : '', onmousedown: (e) => { e.preventDefault(); pick(u); } }, '@' + u.username)));
  };
  const pick = (u) => {
    const m = mentionAt();
    if (!m) return;
    ta.value = ta.value.slice(0, m.start) + `@${u.username} ` + ta.value.slice(ta.selectionStart);
    const pos = m.start + u.username.length + 2;
    ta.setSelectionRange(pos, pos);
    ta.focus();
    sugs = [];
    drawSugs();
  };
  const submit = async () => {
    if (!ta.value.trim()) return;
    send.disabled = true;
    try {
      await rpc('add_comment', { p_task: taskId, p_body: ta.value });
      ta.value = '';
      onPosted();
    } catch (e) {
      err.textContent = errText(e);
    } finally {
      send.disabled = !ta.value.trim();
    }
  };
  ta.addEventListener('input', async () => {
    err.textContent = '';
    send.disabled = !ta.value.trim();
    const m = mentionAt();
    if (!m) { sugs = []; return drawSugs(); }
    const { data } = await sb.from('profiles').select('id,username').eq('status', 'ACTIVE').like('username', `${escLike(m.q)}%`).order('username').limit(8);
    sugs = data || [];
    sel = 0;
    drawSugs();
  });
  ta.addEventListener('keydown', (e) => {
    if (sugs.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % sugs.length; return drawSugs(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + sugs.length) % sugs.length; return drawSugs(); }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return pick(sugs[sel]); }
      if (e.key === 'Escape') { sugs = []; return drawSugs(); }
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit();
  });
  return h('form', { class: 'composer', onsubmit: (e) => { e.preventDefault(); submit(); } }, box, ta, err,
    h('div', { class: 'row-actions', style: { marginTop: '8px' } }, h('span', { class: 'hint' }, 'Ctrl + Enter ile gönder'), h('span', { class: 'spacer' }), send));
}

// Grafikler kartın ölçülen genişliğiyle çizilir: bir birim bir pikseldir, yazılar sayfanın tip ölçeğinde kalır.
function chartBox(build, data) {
  const box = h('div', { class: 'chartbox' });
  let lastW = 0;
  const draw = () => {
    const w = Math.round(box.clientWidth);
    if (!w || w === lastW) return;
    lastW = w;
    box.replaceChildren(build(data, Math.max(w, 260)));
  };
  if (window.ResizeObserver) new ResizeObserver(draw).observe(box);
  requestAnimationFrame(draw);
  return box;
}
function barChart(data, W) {
  if (!data.length) return h('p', { class: 'hint' }, 'Son 30 günde kapanan kayıt yok.');
  const max = Math.max(...data.map((d) => d.count));
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const L = Math.min(130, Math.round(W * 0.28)), R = W - 14, rowH = 38, H = data.length * rowH + 30;
  const x = (v) => L + ((R - L) * v) / top;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Kişi bazında kapanan kayıt sayısı" style="display:block;max-width:100%">`;
  for (let t = 0; t <= top; t += step) s += `<line x1="${x(t)}" y1="2" x2="${x(t)}" y2="${H - 24}" stroke="${t ? '#dde5e1' : '#c5d1cb'}"/><text x="${x(t)}" y="${H - 7}" font-family="Courier Prime, monospace" font-size="12.5" text-anchor="${t === top ? 'end' : 'middle'}" fill="#55626d">${t}</text>`;
  data.forEach((d, i) => {
    const y = 6 + i * rowH, w = Math.max(x(d.count) - L, 2), inside = w > 36;
    s += `<text class="who-lbl" x="${L - 10}" y="${y + 17}" font-family="Libre Franklin, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#1b2733"></text><rect x="${L}" y="${y}" width="${w}" height="24" fill="#2346b5"/><text x="${inside ? L + w - 8 : L + w + 8}" y="${y + 17}" font-family="Courier Prime, monospace" font-size="14" font-weight="700" text-anchor="${inside ? 'end' : 'start'}" fill="${inside ? '#fff' : '#1b2733'}">${Number(d.count)}</text>`;
  });
  const el = svg(s + '</svg>');
  // Kullanıcı adları metin olarak (güvenli) eklenir
  el.querySelectorAll('text.who-lbl').forEach((t, i) => (t.textContent = '@' + data[i].username));
  return el;
}
function trendChart(data, W) {
  const max = Math.max(4, ...data.flatMap((d) => [d.opened, d.completed]));
  const top = Math.ceil(max / 4) * 4;
  const L = 40, R = W - 14, T = 12, B = 176, H = 204;
  const x = (i) => L + 26 + ((R - L - 52) * i) / Math.max(data.length - 1, 1);
  const y = (v) => B - ((B - T) * v) / top;
  const pts = (k) => data.map((d, i) => `${x(i)},${y(d[k])}`).join(' ');
  const last = data.length - 1;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Haftalık açılan ve kaşelenen kayıtlar" style="display:block;max-width:100%">`;
  [0, top / 2, top].forEach((v) => (s += `<line x1="${L}" y1="${y(v)}" x2="${R}" y2="${y(v)}" stroke="${v ? '#dde5e1' : '#c5d1cb'}"/><text x="${L - 8}" y="${y(v) + 4}" font-family="Courier Prime, monospace" font-size="12.5" text-anchor="end" fill="#55626d">${v}</text>`));
  s += `<path d="M${x(0)},${B} L${pts('completed').split(' ').join(' L')} L${x(last)},${B} Z" fill="#2346b5" fill-opacity=".1"/>`;
  s += `<polyline points="${pts('opened')}" fill="none" stroke="#1b2733" stroke-width="2"/><polyline points="${pts('completed')}" fill="none" stroke="#2346b5" stroke-width="2.5"/>`;
  s += `<rect x="${x(last) - 4}" y="${y(data[last].opened) - 4}" width="8" height="8" fill="#1b2733"/><rect x="${x(last) - 4}" y="${y(data[last].completed) - 4}" width="8" height="8" fill="#2346b5"/>`;
  data.forEach((d, i) => (s += `<text x="${x(i)}" y="${H - 6}" font-family="Courier Prime, monospace" font-size="12.5" text-anchor="middle" fill="#55626d">${dmy(d.weekStart).slice(0, 5)}</text>`));
  return svg(s + '</svg>');
}
function reportPage() {
  const root = h('div', null, h('div', { class: 'center' }, 'Yükleniyor…'));
  const load = async () => {
    try {
      const r = await rpc('report_summary');
      const stat = (k, v, cls) => h('div', null, h('div', { class: 'k' }, k), h('div', { class: `v${cls ? ' ' + cls : ''}` }, v));
      root.replaceChildren(
        h('div', { class: 'page-head' }, h('div', null, h('h1', null, 'Dönem dökümü'), h('p', null, 'Açık, geciken ve kaşelenen kayıtlar'))),
        h('div', { class: 'ledger' },
          stat('Açık kayıt', r.open), stat('Geciken', r.overdue, r.overdue ? 'bad' : ''), stat('Bu hafta kaşelenen', r.doneThisWeek),
          stat('Ort. tamamlama süresi (30 gün)', r.avgCompletionDays === null ? '—' : [...String(Number(r.avgCompletionDays).toLocaleString('tr-TR')).split(/(,)/).map((p) => (p === ',' ? h('span', { style: { marginLeft: '-.2em', marginRight: '-.16em' } }, ',') : p)), ' ', h('span', { style: { fontSize: '15px', fontFamily: 'var(--ui)', fontWeight: '600' } }, 'gün')])),
        h('div', { class: 'charts' },
          h('div', { class: 'card' }, h('h2', null, 'Son 30 günde kim kaç kayıt kapattı'), chartBox(barChart, r.perUser)),
          h('div', { class: 'card' }, h('h2', null, 'Haftalık açılan ve kaşelenen'), chartBox(trendChart, r.weekly),
            h('div', { class: 'legend' }, h('span', null, h('i', { style: { background: 'var(--ink)' } }), 'Açılan'), h('span', null, h('i', { style: { background: 'var(--stamp)' } }), 'Kaşelenen')))));
    } catch (e) {
      root.replaceChildren(h('div', { class: 'alert err' }, errText(e)));
    }
  };
  listeners.tasks.add(load);
  load();
  return root;
}

/* =========================================================
   Admin
   ========================================================= */
function adminPage() {
  const body = h('div');
  let tab = 'users';
  const tabs = h('div', { class: 'tabs', role: 'tablist' });
  const drawTabs = () => tabs.replaceChildren(...[['users', 'Kullanıcılar'], ['tags', 'Etiketler'], ['deleted', 'Silinen görevler']].map(([k, l]) =>
    h('button', { role: 'tab', 'aria-selected': String(tab === k), class: tab === k ? 'on' : '', onclick: () => { tab = k; drawTabs(); show(); } }, l)));

  async function users() {
    try {
      const list = await rpc('admin_list_users');
      const patch = async (u, role, status) => {
        try { await rpc('admin_set_user', { p_id: u.id, p_role: role, p_status: status }); toast('Kullanıcı güncellendi.'); users(); }
        catch (e) { toast(errText(e), 'err'); }
      };
      body.replaceChildren(h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
        h('thead', null, h('tr', null, ['Kullanıcı', 'E-posta', 'Rol', 'Durum', 'Açtığı', 'Tamamladığı', ''].map((t) => h('th', null, t)))),
        h('tbody', null, list.map((u) => h('tr', null,
          h('td', null, h('b', null, '@' + u.username), u.id === state.me.id && h('span', { class: 'hint' }, ' (sen)')),
          h('td', null, u.email),
          h('td', null, u.role === 'ADMIN' ? h('span', { class: 'pill s-OPEN' }, 'Admin') : 'Kullanıcı'),
          h('td', null, u.status === 'ACTIVE' ? h('span', { class: 'pill s-DONE' }, 'Aktif') : h('span', { class: 'pill p-ACIL' }, 'Pasif')),
          h('td', { class: 'num' }, u.created_count), h('td', { class: 'num' }, u.completed_count),
          h('td', null, h('div', { class: 'row-actions', style: { flexWrap: 'nowrap' } },
            h('button', { class: 'btn ghost sm', onclick: () => patch(u, u.role === 'ADMIN' ? 'USER' : 'ADMIN', u.status) }, u.role === 'ADMIN' ? 'Adminliği al' : 'Admin yap'),
            u.id !== state.me.id && h('button', { class: u.status === 'ACTIVE' ? 'btn danger sm' : 'btn ghost sm', onclick: () => patch(u, u.role, u.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE') }, u.status === 'ACTIVE' ? 'Pasifleştir' : 'Aktifleştir')))))))));
    } catch (e) { body.replaceChildren(h('div', { class: 'alert err' }, errText(e))); }
  }

  async function tags() {
    const list = await loadTags(true);
    let name = '', color = TAG_COLORS[0];
    const err = h('div', { class: 'hint err' });
    const addBtn = h('button', { class: 'btn', disabled: true }, 'Ekle');
    const swatches = h('div', { class: 'tagpick', role: 'radiogroup', 'aria-label': 'Etiket rengi', style: { paddingTop: '6px' } });
    const drawSw = () => swatches.replaceChildren(...TAG_COLORS.map((c) => h('button', { type: 'button', role: 'radio', 'aria-checked': String(c === color), 'aria-label': 'Renk ' + c, class: c === color ? 'on' : '', style: { padding: '4px' }, onclick: () => { color = c; drawSw(); } }, h('i', { style: { background: c, width: '14px', height: '14px' } }))));
    drawSw();
    body.replaceChildren(h('div', { class: 'card', style: { maxWidth: '620px' } },
      h('form', { class: 'row-actions', style: { alignItems: 'flex-start' }, onsubmit: async (e) => {
        e.preventDefault();
        try { await rpc('create_tag', { p_name: name, p_color: color }); toast('Etiket eklendi.'); tags(); }
        catch (x) { err.textContent = errText(x); }
      } }, h('input', { id: 'tag-name', class: 'input', style: { flex: '1', minWidth: '160px' }, placeholder: 'Yeni etiket adı', maxlength: '24', oninput: (e) => { name = e.target.value; addBtn.disabled = name.trim().length < 2; } }), swatches, addBtn),
      err,
      h('div', { class: 'row-actions', style: { marginTop: '16px' } }, list.map((t) => h('span', { class: 'row-actions', style: { gap: '2px' } }, tagChip(t),
        h('button', { class: 'linkbtn', style: { color: 'var(--red)', fontSize: '12px', marginRight: '10px' }, 'aria-label': t.name + ' etiketini sil', onclick: async () => { await rpc('delete_tag', { p_id: t.id }); tags(); } }, ICON_X()))))));
  }

  async function deleted() {
    const { data } = await sb.from('tasks').select(TASK_LIST_SELECT).not('deleted_at', 'is', null).order('created_at', { ascending: false });
    if (!data || !data.length) return body.replaceChildren(h('div', { class: 'empty' }, 'Silinmiş görev yok.'));
    body.replaceChildren(h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, ['Görev', 'Oluşturan', 'Durum', ''].map((t) => h('th', null, t)))),
      h('tbody', null, data.map((t) => h('tr', null, h('td', null, h('a', { href: '#/gorev/' + t.id }, t.title)), h('td', null, `@${t.created_by.username} · ${ago(t.created_at)}`),
        h('td', null, t.status === 'DONE' ? 'Tamamlandı' : 'Açık'),
        h('td', null, h('button', { class: 'btn ghost sm', onclick: async () => { await rpc('restore_task', { p_id: t.id }); toast('Görev geri alındı.'); deleted(); } }, 'Geri al'))))))));
  }

  const show = () => (tab === 'users' ? users() : tab === 'tags' ? tags() : deleted());
  drawTabs();
  show();
  return h('div', null, h('div', { class: 'page-head' }, h('h1', null, 'Admin')), tabs, body);
}

</script>
